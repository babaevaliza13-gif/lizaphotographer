<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Liza Babaieva is a photographer and filmmaker in Espoo, Finland, creating intimate portrait, editorial, film, event and moving image work."
    />
    <meta property="og:title" content="Liza Babaieva - Photographer & Filmmaker" />
    <meta property="og:description" content="Editorial photography, film portraits and moving image work in Espoo, Finland." />
    <meta property="og:type" content="website" />
    <title>Liza Babaieva - Photographer & Filmmaker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>

    <aside class="side-rail" data-header>
      <a class="brand magnetic" href="#home" data-route="home" aria-label="Liza Babaieva home">Liza Babaieva</a>
      <button class="mobile-menu-toggle magnetic" type="button" data-mobile-menu-toggle aria-expanded="false">Menu</button>
      <nav class="side-nav" data-menu-links aria-label="Primary navigation"></nav>
      <div class="rail-footer">
        <span></span>
        <p>All content copyright the artist. No commercial use without express written permission.</p>
        <p>© 2026 Liza Babaieva.</p>
      </div>
    </aside>
    <main id="app"></main>

    <div class="lightbox" data-lightbox aria-hidden="true">
      <button class="lightbox-close magnetic" type="button" data-lightbox-close aria-label="Close image">Close</button>
      <button class="lightbox-prev magnetic" type="button" data-lightbox-prev aria-label="Previous image">Prev</button>
      <img data-lightbox-img alt="" />
      <button class="lightbox-next magnetic" type="button" data-lightbox-next aria-label="Next image">Next</button>
      <p data-lightbox-caption></p>
    </div>

    <div class="cookie-consent" data-cookie-consent hidden>
      <p>We use cookies to keep the site working smoothly and to understand basic visitor activity.</p>
      <button type="button" data-cookie-accept>Accept</button>
    </div>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
