<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Liza Babaieva Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="admin-body">
    <main class="admin-login-page">
      <form class="admin-login-card" data-login-form>
        <p class="admin-kicker">Private area</p>
        <h1>Admin login</h1>
        <label>Password<input name="password" type="password" autocomplete="current-password" autofocus /></label>
        <button type="submit">Enter admin</button>
        <p data-login-status role="status"></p>
      </form>
    </main>
    <script type="module" src="/src/js/login.js"></script>
  </body>
</html>
